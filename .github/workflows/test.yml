name: tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install package and tests
        run: python -m pip install . pytest
      - name: Verify module and installed CLI
        run: |
          python -m offstap --help
          offstap --help
      - name: Run tests
        run: python -m pytest -q
