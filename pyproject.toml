[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "offstap"
version = "0.1.0"
description = "Offline spatiotemporal alignment of EV3 telemetry and Vive tracking logs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.0",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "pyarrow==24.0.0",
    "PyYAML==6.0.3",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
]

[project.urls]
Repository = "https://github.com/stachir/OFF-STAP"
Issues = "https://github.com/stachir/OFF-STAP/issues"

[project.scripts]
offstap = "offstap.cli:main"

[tool.setuptools.packages.find]
include = ["offstap*"]

[tool.setuptools.package-data]
offstap = ["config/*.yaml"]
